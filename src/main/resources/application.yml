spring:
  application:
    name: spring-boot-practise
  datasource:
    url: jdbc:postgresql://localhost:5432/mmparts
    username: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect
